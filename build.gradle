plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    // Lanterne agit dans les boucles chaudes du serveur : il lui faut des mixins, là où AutoMiner se
    // contentait des évènements. Un évènement est un appel de plus ; un mixin est une modification
    // du code en place, que le JIT peut ensuite inliner comme s'il avait toujours été là. Sur un
    // chemin exécuté cent mille fois par tick, la différence n'est pas cosmétique.
    runs {
        client {
            client()
            // <h2>Ouvrir un monde sans qu'un humain ne clique</h2>
            //
            // Le banc d'images ne vaut que s'il est reproductible, et un protocole qui commence par
            // « cliquer sur Jouer » ne l'est pas : il ne tournerait qu'à la main, c'est-à-dire
            // rarement, c'est-à-dire jamais.
            //
            // « --quickPlaySingleplayer » est une option du jeu lui-même, prévue pour les lanceurs :
            // elle ouvre directement un monde de « saves » et saute les menus. Le monde « banc » est
            // une copie du monde du serveur de mesure, pour que les deux côtés observent le même
            // terrain.
            //
            // Conditionnée à la variable d'environnement pour ne pas imposer ce monde à un lancement
            // ordinaire du client pendant le développement.
            if (System.getenv('LANTERNE_GLASS') == '1') {
                programArgument '--quickPlaySingleplayer'
                programArgument 'banc'
            }
        }
        server {
            server()
            programArgument '--nogui'
            // <h2>Choisir le ramasse-miettes depuis la ligne de commande</h2>
            //
            // La machine visee n'a qu'un coeur. Sur un coeur, les fils concurrents de G1 ne
            // travaillent pas A COTE du tick : ils le lui prennent. Il faut donc pouvoir comparer
            // G1 et le ramasse-miettes serie, et cela se mesure, cela ne se suppose pas.
            //
            //   ./gradlew runServer -Pgc=serial
            //
            // Sans la propriete, rien n'est impose et la machine virtuelle choisit comme d'habitude.
            if (project.hasProperty('gc')) {
                if (project.property('gc') == 'serial') {
                    jvmArgument '-XX:+UseSerialGC'
                } else if (project.property('gc') == 'g1') {
                    jvmArgument '-XX:+UseG1GC'
                }
            }
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// <h2>Le décodeur MP3, embarqué dans l'archive</h2>
//
// Le mod ne convertit plus les fichiers du joueur : il les décode. Le Vorbis et le WAV sont lus par
// du code du dépôt ; le MP3 est délégué à JLayer, qui est un vrai décodeur — bancs de filtres,
// tables de Huffman, réservoir de bits — et qu'il serait déraisonnable de réécrire.
//
// « jarJar » le place dans META-INF/jarjar de l'archive publiée, d'où NeoForge le charge au
// démarrage. Sans cela il serait présent à la compilation et ABSENT à l'exécution : la panne ne se
// verrait ni ici ni au lancement, seulement quand un joueur clique sur « Graver ».
//
// La licence est la LGPL-2.1, compatible avec la GPL-3.0-only du mod. Le dépôt Maven central doit
// être déclaré : le greffon de NeoForge n'ajoute que les siens et ceux de Mojang.
repositories {
    mavenCentral()
}

dependencies {
    jarJar(implementation('javazoom:jlayer:[1.0.1,1.1)')) {
        version {
            prefer '1.0.1'
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Le chemin de classes, depose sur disque pour le controleur de mixins.
//
// Une cible de mixin est une CHAINE DE CARACTERES, que le compilateur ne relit
// jamais. Un mixin dont la methode visee a ete renommee compile parfaitement et
// n'echoue qu'au demarrage du jeu. Le passage a 26.2 l'a demontre :
// EntityCullMixin visait « LevelRenderer.extractVisibleEntities », methode
// deplacee dans une classe neuve. Tout compilait, le serveur dedie demarrait —
// et pour cause, un serveur dedie ne charge aucun mixin client. Le defaut
// n'aurait ete visible qu'au premier lancement par un joueur.
//
// « tools/verifie_mixins.py » relit ces chaines et les confronte au bytecode. Il
// lui faut le chemin de classes complet : sans les jars de NeoForge, tout mixin
// visant une classe de NeoForge serait signale a tort, et un controleur qui crie
// au loup se fait debrancher.
tasks.register('cheminDeClasses') {
    dependsOn tasks.named('compileJava')
    def sortie = layout.buildDirectory.file('chemin-de-classes.txt')
    def entrees = configurations.named('compileClasspath')
    outputs.file(sortie)
    doLast {
        sortie.get().asFile.text = entrees.get().files.collect { it.absolutePath }.join(';')
    }
}

tasks.register('verifieMixins', Exec) {
    group = 'verification'
    description = 'Chaque mixin vise-t-il encore une methode qui existe ?'
    dependsOn tasks.named('cheminDeClasses')
    commandLine 'python', file('tools/verifie_mixins.py').absolutePath
}

// Compilation partielle, pour travailler a deux sur ce depot.
//
// Quand un second chantier est en cours dans fr.clubcitrouille.lanterne.content, ses classes
// peuvent etre momentanement incompletes et empecher toute compilation — y compris celle des
// modules qui n'ont rien a voir avec elles. `-Psanscontenu` les met de cote le temps de verifier
// le reste. Sans la propriete, rien ne change : le mod se compile en entier.
tasks.withType(JavaCompile).configureEach {
    if (project.hasProperty('sanscontenu')) {
        // Seulement le chantier en cours. Les paquets deja branches dans Lanterne.java ne peuvent
        // plus etre exclus : leur absence casserait la classe principale.
        exclude 'fr/clubcitrouille/lanterne/content/shop/**'
        exclude 'fr/clubcitrouille/lanterne/client/shop/**'
    }
}
