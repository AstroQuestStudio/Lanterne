plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    // Lanterne agit dans les boucles chaudes du serveur : il lui faut des mixins, là où AutoMiner se
    // contentait des évènements. Un évènement est un appel de plus ; un mixin est une modification
    // du code en place, que le JIT peut ensuite inliner comme s'il avait toujours été là. Sur un
    // chemin exécuté cent mille fois par tick, la différence n'est pas cosmétique.
    runs {
        client {
            client()
            // <h2>Ouvrir un monde sans qu'un humain ne clique</h2>
            //
            // Le banc d'images ne vaut que s'il est reproductible, et un protocole qui commence par
            // « cliquer sur Jouer » ne l'est pas : il ne tournerait qu'à la main, c'est-à-dire
            // rarement, c'est-à-dire jamais.
            //
            // « --quickPlaySingleplayer » est une option du jeu lui-même, prévue pour les lanceurs :
            // elle ouvre directement un monde de « saves » et saute les menus. Le monde « banc » est
            // une copie du monde du serveur de mesure, pour que les deux côtés observent le même
            // terrain.
            //
            // Conditionnée à la variable d'environnement pour ne pas imposer ce monde à un lancement
            // ordinaire du client pendant le développement.
            //
            // LANTERNE_SAVE seule ouvre un monde donné sans armer le banc d'images (Glass) : utile
            // pour observer une vraie partie (un monde importé, richement construit) sans que Glass
            // n'y bâtisse sa scène synthétique par-dessus.
            if (System.getenv('LANTERNE_GLASS') == '1' || System.getenv('LANTERNE_SAVE') != null) {
                programArgument '--quickPlaySingleplayer'
                programArgument System.getenv('LANTERNE_SAVE') ?: 'banc'
            }
            // Même isolement que runServer (voir plus bas) : deux clients lancés en même temps —
            // deux agents qui travaillent sur ce dépôt en parallèle — se disputent sinon le même
            // session.lock et le même run/logs/latest.log, avec des écritures concurrentes qui
            // corrompent ce dernier. Constaté en pratique, pas supposé.
            //
            //   ./gradlew runClient -Pbanc=duel
            if (project.hasProperty('banc')) {
                gameDirectory = project.file("run-${project.property('banc')}")
            }
        }
        server {
            server()
            programArgument '--nogui'
            // <h2>Un dossier par banc, pour que deux mesures ne se marchent pas dessus</h2>
            //
            // Le serveur de developpement tourne dans « run/ », et y verrouille son monde et son
            // journal. Deux epreuves lancees en meme temps — ce qui arrive des qu'on travaille a
            // plusieurs sur ce depot — echouent alors sur « le processus ne peut pas acceder au
            // fichier », et le message ne dit rien de la cause.
            //
            //   ./gradlew runServer -Pbanc=duel
            //
            // Chacun a son « run-duel/ », son monde et son verrou. Sans la propriete, rien ne
            // change : c'est bien « run/ » qui sert, avec le monde de developpement habituel.
            if (project.hasProperty('banc')) {
                gameDirectory = project.file("run-${project.property('banc')}")
                systemProperty 'lanterne.banc', project.property('banc').toString()
            }
            // <h2>Choisir le ramasse-miettes depuis la ligne de commande</h2>
            //
            // La machine visee n'a qu'un coeur. Sur un coeur, les fils concurrents de G1 ne
            // travaillent pas A COTE du tick : ils le lui prennent. Il faut donc pouvoir comparer
            // G1 et le ramasse-miettes serie, et cela se mesure, cela ne se suppose pas.
            //
            //   ./gradlew runServer -Pgc=serial
            //
            // Sans la propriete, rien n'est impose et la machine virtuelle choisit comme d'habitude.
            if (project.hasProperty('gc')) {
                if (project.property('gc') == 'serial') {
                    jvmArgument '-XX:+UseSerialGC'
                } else if (project.property('gc') == 'g1') {
                    jvmArgument '-XX:+UseG1GC'
                }
            }
            // <h2>Mesurer comme si la machine n'avait qu'un coeur</h2>
            //
            // Choisir le ramasseur ne suffit pas : G1 dimensionne ses reservoirs de fils sur le
            // nombre de processeurs qu'il VOIT. Lance sur le Ryzen a huit coeurs de mesure, il
            // ouvre huit fils paralleles et deux fils concurrents, c'est-a-dire une configuration
            // que la MyBox n'aura jamais. Comparer serial et G1 dans ces conditions repondrait a
            // une question que personne ne se pose.
            //
            //   ./gradlew runServer -Pgc=g1 -Pcoeurs=1
            //
            // « ActiveProcessorCount » est l'option prevue par HotSpot pour exactement cela : tout
            // ce qui se dimensionne sur le nombre de processeurs — ramasseur, compilateur, pool
            // commun — se dimensionne sur ce nombre-la.
            //
            // Ce qu'elle ne fait PAS : empecher le systeme de donner huit coeurs a ces fils. Le
            // banc reproduit la CONFIGURATION de la cible, pas sa PENURIE. Voir lab/Fonte.java, qui
            // le redit dans son rapport pour qu'aucun chiffre ne circule sans cette reserve.
            if (project.hasProperty('coeurs')) {
                jvmArgument "-XX:ActiveProcessorCount=${project.property('coeurs')}".toString()
            }
            // <h2>Mesurer sur le tas de la cible, et non sur celui du poste de developpement</h2>
            //
            // La premiere comparaison serial/G1 a rendu un verdict vide : trois ramassages en
            // quatre cents ticks, et des pauses de 47 a 78 ms qui se chevauchaient completement.
            // La cause n'etait pas le bruit, c'etait le TAS — huit gigaoctets par defaut sur la
            // machine de mesure, contre quatre sur la MyBox. Avec autant de place, le ramasseur ne
            // passe presque jamais, et deux ramasseurs qui ne passent pas se ressemblent beaucoup.
            //
            //   ./gradlew runServer -Pgc=g1 -Pcoeurs=1 -Ptas=2000
            //
            // Deux mille megaoctets place aussi le banc du BON cote du seuil de 1792 Mo : la
            // machine virtuelle retient alors G1 malgre le coeur unique, ce qui est exactement la
            // configuration que core/Creuset.java signale a l'administrateur.
            if (project.hasProperty('tas')) {
                jvmArgument "-Xmx${project.property('tas')}m".toString()
                jvmArgument "-Xms${project.property('tas')}m".toString()
            }
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// <h2>Le décodeur MP3, embarqué dans l'archive</h2>
//
// Le mod ne convertit plus les fichiers du joueur : il les décode. Le Vorbis et le WAV sont lus par
// du code du dépôt ; le MP3 est délégué à JLayer, qui est un vrai décodeur — bancs de filtres,
// tables de Huffman, réservoir de bits — et qu'il serait déraisonnable de réécrire.
//
// « jarJar » le place dans META-INF/jarjar de l'archive publiée, d'où NeoForge le charge au
// démarrage. Sans cela il serait présent à la compilation et ABSENT à l'exécution : la panne ne se
// verrait ni ici ni au lancement, seulement quand un joueur clique sur « Graver ».
//
// La licence est la LGPL-2.1, compatible avec la GPL-3.0-only du mod. Le dépôt Maven central doit
// être déclaré : le greffon de NeoForge n'ajoute que les siens et ceux de Mojang.
repositories {
    mavenCentral()

    // <h2>Le dépôt de CaffeineMC, pour l'API d'options de Sodium — et pour elle seule</h2>
    //
    // « includeGroup » n'est pas une précaution de style : sans lui, Gradle interrogerait ce
    // serveur pour CHAQUE dépendance du projet avant de retomber sur Maven Central. Un dépôt
    // de mod qui répond lentement — ou pas du tout — ralentirait alors une compilation qui n'a
    // rien à voir avec lui.
    maven {
        name = 'CaffeineMC'
        url = 'https://maven.caffeinemc.net/releases'
        content {
            includeGroup 'net.caffeinemc'
        }
    }

    // Le dépôt de PaperMC, pour velocity-native — même raison de portée que ci-dessus.
    maven {
        name = 'PaperMC'
        url = 'https://repo.papermc.io/repository/maven-public/'
        content {
            includeGroup 'com.velocitypowered'
        }
    }
}

// <h2>Le décodeur vidéo : les liaisons embarquées, les binaires téléchargés</h2>
//
// Le partage n'est pas arbitraire, il suit une différence de taille d'un facteur quarante.
//
//   org.bytedeco:javacpp        543 Kio  - Java pur, le chargeur de natifs
//   org.bytedeco:ffmpeg         289 Kio  - Java pur, les liaisons vers libav*
//   ---------------------------------------------------------------------------
//   embarqué dans l'archive     832 Kio
//
//   ffmpeg:<plateforme>       29,03 Mio  - les vraies bibliothèques (Windows x86-64)
//   javacpp:<plateforme>       1,94 Mio
//   ---------------------------------------------------------------------------
//   téléchargé une fois        30,97 Mio, et seulement sur consentement du joueur
//
// Embarquer les six plateformes aurait donné une archive de plus de cent quatre-vingts
// mébioctets pour un mod dont l'identité est la légèreté. Embarquer la seule plateforme de
// compilation aurait fait un mod qui ne marche que sous Windows.
//
// Les liaisons, elles, sont du Java pur et sans natif : les embarquer coûte moins que le
// décodeur MP3 déjà présent, et cela évite un chargeur de classes maison — le genre de
// mécanique qui marche en développement et casse chez le joueur. Voir client/screen/Fetch.java
// pour la façon dont les binaires sont ensuite trouvés sur le disque, qui a été éprouvée hors
// du jeu par tools/EssaiLav.java.
//
// Licences : le greffon de bytedeco est en Apache-2.0 OU GPLv2 avec exception de chemin de
// classes, au choix du preneur. Les binaires publiés sans « --enable-gpl » sont en LGPL v3.
// Les deux conviennent à la GPL-3.0-only de ce mod. Voir notes/projecteur.md.
dependencies {
    // <h2>L'API d'options de Sodium : « compileOnly », et rien d'autre</h2>
    //
    // Sodium remplace l'écran vidéo de vanilla. Le bouton que « mixin/VideoOptionsMixin » y pose
    // disparaît donc dès qu'il est installé, et avec lui l'accès aux soixante-cinq réglages du mod.
    // Sodium prévoit ce cas : « net.caffeinemc:sodium-neoforge-api » est un artefact SÉPARÉ de
    // quarante-neuf kibioctets, qui ne contient que « net/caffeinemc/mods/sodium/api/** » — aucune
    // ligne du moteur de rendu. C'est lui que « client/sodium/Graft.java » implémente.
    //
    // Trois raisons de le déclarer « compileOnly » plutôt que « implementation », et la troisième
    // est la seule qui compte vraiment :
    //
    //   1. On ne s'en sert qu'à la compilation. La classe qui l'implémente n'est nommée nulle part
    //      dans le mod — c'est Sodium qui la charge par « Class.forName » sur une chaîne lue dans
    //      « neoforge.mods.toml ». Sans Sodium, elle n'est jamais résolue.
    //   2. « implementation » le ferait apparaître dans les métadonnées publiées, c'est-à-dire
    //      annoncer une dépendance qui n'en est pas une.
    //   3. LA LICENCE. Sodium est sous PolyForm Shield 1.0.0 — source ouverte à la lecture, mais
    //      NON LIBRE : clause de non-concurrence, non reconnue par l'OSI, incompatible avec la
    //      GPL-3.0-only de ce mod. Le fichier « LICENSE.md » est embarqué jusque dans l'artefact
    //      d'API, il a été lu et non supposé. Rien n'en est copié, rien n'en est embarqué par
    //      jarJar, rien n'en est ombré : l'archive publiée de Lanterne ne contient AUCUN octet de
    //      Sodium, et c'est « compileOnly » qui le garantit. Voir NOTICE.md.
    //
    // La version suit celle de Minecraft : l'API n'est pas compatible d'une version du jeu à
    // l'autre — « ResourceLocation » y est devenu « Identifier » en 26.x, et le renommage traverse
    // toute la signature des constructeurs d'options.
    compileOnly 'net.caffeinemc:sodium-neoforge-api:0.9.2+mc26.2'

    // <h2>Le sélecteur de fichiers natif n'est plus une dépendance transitive du jeu</h2>
    //
    // La 26.2 embarquait encore GLFW, et « lwjgl-tinyfd » venait avec — jamais déclaré ici parce
    // que jamais nécessaire de le déclarer. La 26.3 remplace GLFW par SDL pour tout ce qui touche
    // au jeu lui-même (fenêtre, clavier), et tinyfd n'a pas d'équivalent SDL dans le jeu : ce
    // module l'utilise pour une raison qui n'a rien à voir avec vanilla — laisser le joueur
    // choisir une image sur son disque dans client/painting/Reach.java — et doit donc désormais le
    // demander lui-même. « compileOnly » suffit : l'appel est déjà protégé par un
    // « catch (Throwable) » qui bascule sur les deux autres voies (lien, dossier surveillé) si le
    // sélecteur natif est absent au lancement — voir Reach.java.
    compileOnly 'org.lwjgl:lwjgl-tinyfd:3.4.1'

    jarJar(implementation('javazoom:jlayer:[1.0.1,1.1)')) {
        version {
            prefer '1.0.1'
        }
    }
    jarJar(implementation('org.bytedeco:javacpp:[1.5.14,1.6)')) {
        version {
            prefer '1.5.14'
        }
    }
    jarJar(implementation('org.bytedeco:ffmpeg:[8.1.2-1.5.14,8.2)')) {
        version {
            prefer '8.1.2-1.5.14'
        }
    }

    // <h2>Le chiffreur réseau de Krypton</h2>
    //
    // Contient l'API (VelocityCipher, Natives) et les binaires natifs OpenSSL pour les plateformes
    // courantes, avec repli Java pur intégré si aucun binaire ne correspond — jamais d'échec au
    // démarrage, seulement un gain variable selon la plateforme. Voir core/network/ et NOTICE.md.
    // <h2>Le conflit de version, et pourquoi on l'exclut plutôt que de le forcer</h2>
    //
    // velocity-native réclame Netty 4.2.18.Final et Guava 33.7.1-jre en dépendances transitives ;
    // « net.neoforged:minecraft-dependencies:26.3 » épingle ces mêmes bibliothèques à des versions
    // légèrement antérieures (Netty 4.2.16.Final, Guava 33.6.0-jre) avec « strictly », c'est-à-dire
    // sans tolérer qu'une version plus récente les remplace. Les deux exigences sont incompatibles
    // et la résolution de dépendances échoue net.
    //
    // On n'a pas besoin des jars de velocity-native pour Netty ou Guava : ce sont des bibliothèques
    // déjà présentes, en entier, sur le classpath du jeu — NeoForge les y met lui-même. Le code de
    // velocity-native se lie à leurs classes à l'exécution, peu importe qui les a apportées. Exclure
    // ces groupes transitifs revient donc à dire « sers-toi de ce qui est déjà là », ce qui est vrai
    // dans tous les cas, alors que forcer une version choisirait arbitrairement laquelle des deux
    // demandes doit céder.
    jarJar(implementation('com.velocitypowered:velocity-native:[4.2.0,5.0)')) {
        version {
            prefer '4.2.0'
        }
        exclude group: 'io.netty'
        exclude group: 'com.google.guava', module: 'guava'
        exclude group: 'org.jspecify', module: 'jspecify'
    }
}

// <h2>La licence voyage avec le jar, et ce n'est pas une politesse</h2>
//
// Le jar publie ne contenait QUE le manifeste, la configuration des mixins et
// neoforge.mods.toml. Ni le texte de la GPL, ni le fichier d'attributions. Or :
//
//   - la GPL-3.0 exige (article 4) que son texte accompagne toute distribution ;
//   - les bibliotheques embarquees par jarJar sont sous LGPL (JLayer, « version 2
//     ou ulterieure » — verifie dans l'en-tete de ses sources, donc compatible) et
//     sous Apache-2.0 (les liaisons de bytedeco), et l'Apache-2.0 impose en son
//     article 4(d) de transmettre le fichier d'attributions ;
//   - NOTICE.md est le seul endroit ou est ecrit CE QUI A ETE REPRIS ET A QUI.
//     Le laisser dans le depot et pas dans le jar revient a crediter les auteurs
//     devant ceux qui lisent le code, et pas devant ceux qui installent le mod.
//
// Un depot irreprochable et un jar muet, c'est le jar qui est distribue.
tasks.named('jar', Jar) {
    // <h2>Le manifeste faisait vingt-cinq octets</h2>
    //
    // Exactement une ligne : « Manifest-Version: 1.0 ». Ce n'est pas un defaut de
    // chargement — FML lit « META-INF/neoforge.mods.toml » et se moque du reste —
    // mais c'est ce que lisent les OUTILS : un lanceur tiers, un antivirus, un
    // script de tri, « java -jar », et l'utilisateur qui ouvre le zip pour verifier
    // ce qu'il installe. Ce depot a deja eu a se defendre d'un faux positif
    // d'antivirus (voir README.md) ; un jar anonyme n'aide pas.
    //
    // Les noms d'attributs sont ceux de la specification JAR, pas des inventions :
    // « Implementation-* » identifie la version livree, « Specification-* » la
    // version d'interface visee. Ce sont ceux que « Package.getImplementationVersion »
    // rend a l'execution.
    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : 'Club Citrouille',
                'Specification-Version'   : minecraft_version,
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : 'Club Citrouille',
                'Automatic-Module-Name'   : 'fr.clubcitrouille.lanterne',
        ])
    }
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
    }
    from(rootProject.file('NOTICE.md')) {
        into 'META-INF'
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Le chemin de classes, depose sur disque pour le controleur de mixins.
//
// Une cible de mixin est une CHAINE DE CARACTERES, que le compilateur ne relit
// jamais. Un mixin dont la methode visee a ete renommee compile parfaitement et
// n'echoue qu'au demarrage du jeu. Le passage a 26.2 l'a demontre :
// EntityCullMixin visait « LevelRenderer.extractVisibleEntities », methode
// deplacee dans une classe neuve. Tout compilait, le serveur dedie demarrait —
// et pour cause, un serveur dedie ne charge aucun mixin client. Le defaut
// n'aurait ete visible qu'au premier lancement par un joueur.
//
// « tools/verifie_mixins.py » relit ces chaines et les confronte au bytecode. Il
// lui faut le chemin de classes complet : sans les jars de NeoForge, tout mixin
// visant une classe de NeoForge serait signale a tort, et un controleur qui crie
// au loup se fait debrancher.
tasks.register('cheminDeClasses') {
    dependsOn tasks.named('compileJava')
    def sortie = layout.buildDirectory.file('chemin-de-classes.txt')
    def entrees = configurations.named('compileClasspath')
    outputs.file(sortie)
    doLast {
        sortie.get().asFile.text = entrees.get().files.collect { it.absolutePath }.join(';')
    }
}

tasks.register('verifieMixins', Exec) {
    group = 'verification'
    description = 'Chaque mixin vise-t-il encore une methode qui existe ?'
    dependsOn tasks.named('cheminDeClasses')
    commandLine 'python', file('tools/verifie_mixins.py').absolutePath
}

// Compilation partielle, pour travailler a deux sur ce depot.
//
// Quand un second chantier est en cours dans fr.clubcitrouille.lanterne.content, ses classes
// peuvent etre momentanement incompletes et empecher toute compilation — y compris celle des
// modules qui n'ont rien a voir avec elles. `-Psanscontenu` les met de cote le temps de verifier
// le reste. Sans la propriete, rien ne change : le mod se compile en entier.
tasks.withType(JavaCompile).configureEach {
    if (project.hasProperty('sanscontenu')) {
        // Seulement le chantier en cours. Les paquets deja branches dans Lanterne.java ne peuvent
        // plus etre exclus : leur absence casserait la classe principale.
        exclude 'fr/clubcitrouille/lanterne/content/shop/**'
        exclude 'fr/clubcitrouille/lanterne/client/shop/**'
    }
}
